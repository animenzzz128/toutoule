[project]
name = "toutoule"
version = "0.1.0"
description = "LLM-powered job-application triage with verbatim evidence and human approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Leave code examples inside Markdown docs exactly as written.
exclude = ["*.md"]

[tool.ruff.lint]
# E/W: style errors, F: bugs like unused imports, I: import order,
# UP: modern Python syntax, B: common bug patterns.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
